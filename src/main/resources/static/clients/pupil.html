<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Music Lesson Booking Service | Pupil / Parent</title>
        <link rel="stylesheet" href="../style.css" />
    </head>
    <body>
        <div id="login">
            <h1 class="align-center large-top-margin">Pupil Login</h1>

            <p class="align-center large-top-margin bottom-margin">
                To access, enter your full name and matriculation number.
            </p>

            <form id="login-form" class="align-center">
                <div>
                    <label for="name">Full name:</label>
                    <input type="text" id="name" name="name" required />
                </div>

                <div>
                    <label for="matric">Matriculation number:</label>
                    <input type="number" id="matric" name="matric" required />
                </div>

                <button class="top-margin" type="submit">Log in</button>

                <div class="large-top-margin">
                    <a href="/"><< Back to role selection</a>
                </div>
            </form>
        </div>
        <div id="dashboard" hidden>
            <h1 class="align-center large-top-margin">Pupil Dashboard</h1>

            <p class="align-center top-margin bottom-margin">
                On this page, you can view and cancel your booked lessons, and book lessons for next week.
            </p>

            <h2>Booked lessons</h2>

            <h3>This week:</h3>
            <div id="this-week-section" class="booked-lesson-container"></div>

            <h3 class="top-margin">Next week:</h3>
            <div id="next-week-section" class="booked-lesson-container""></div>

            <h2>Book lessons for next week</h2>

            <div>
                <select id="instrument-select">
                    <option value="">Select an instrument</option>
                </select>

                <select id="tutor-select">
                    <option value="">Select a tutor</option>
                </select>
                <button id="show-timetable-button">Show available times</button>
            </div>
            <div id="tutor-timetable">

            </div>
            <div class="large-top-margin align-center">
                <a href="/"><< Log out</a>
            </div>
        </div>
    </body>

    <script src="../js/common.js"></script>
    <script>
        document
            .getElementById("login-form")
            .addEventListener("submit", async (event) => {
                event.preventDefault();

                const name = document.getElementById("name").value.trim();
                const matric = Number(document.getElementById("matric").value);

                let result;

                try {
                    result = await makePostRequest("/pupils/verify", {
                        name: name,
                        matric: matric,
                    });
                } catch (error) {
                    alert("Verification failed.");
                    return;
                }

                if (result.valid) {
                    window.name = result.name;
                    window.matric = result.matric;
                    window.age = result.age;
                    window.instruments = result.instruments;

                    window.tutors = await makeGetRequest(`/tutors/eligible?pupilMatric=${result.matric}`);

                    document.getElementById("login").hidden = true;
                    document.getElementById("dashboard").hidden = false;

                    await renderDashboard();
                    await updateBookingSection();
                } else {
                    alert(
                        "Incorrect login details. Check your name and matriculation number.",
                    );
                    return;
                }
            });

        async function renderDashboard() {
          const thisWeekSection = document.getElementById("this-week-section");
          const nextWeekSection = document.getElementById("next-week-section");
          const instrumentSelect = document.getElementById("instrument-select");

          thisWeekSection.innerHTML = "";
          nextWeekSection.innerHTML = "";

          const lessonsThisWeek = await makeGetRequest(`/bookings/this-week?matric=${window.matric}`)
          const lessonsNextWeek = await makeGetRequest(`/bookings/next-week?matric=${window.matric}`)

          for (const lesson of lessonsThisWeek) {
            thisWeekSection.innerHTML += bookedLessonHTML(lesson);
          }

          for (const lesson of lessonsNextWeek) {
            nextWeekSection.innerHTML += bookedLessonHTML(lesson, true);
          }

          for (const instrument of Object.keys(window.instruments)) {
            const option = document.createElement("option");

            option.value = instrument;
            option.textContent = instrument;

            instrumentSelect.appendChild(option);
          }
        }

        async function cancelBooking(bookingId) {
            if (!confirm("Are you sure you want to cancel this booking?")) {
                return;
            }

            try {
                await makeDeleteRequest(`/bookings/${bookingId}`);
            } catch (error) {
                alert("Failed cancelling booking.");
            }

            renderDashboard();
        }

        function bookedLessonHTML(lesson, allowCancel = false) {
          const startDate = new Date(lesson.startDateTime);
          const endDate = new Date(startDate);

          endDate.setMinutes(endDate.getMinutes() + 30);

          const date = startDate.toLocaleDateString("en-GB");
          const start = startDate.toLocaleTimeString("en-GB", {
              hour: "2-digit",
              minute: "2-digit"
          });
          const end = endDate.toLocaleTimeString("en-GB", {
              hour: "2-digit",
              minute: "2-digit"
          });

          let html = `
            <div class="booked-lesson">
              <h4 class="capitalize">${lesson.instrument}</h4>
              <ul>
                <li>${date}</li>
                <li>${start} - ${end}</li>
                <li>tutor: ${lesson.tutor.firstName} ${lesson.tutor.lastName}</li>
              </ul>
          `

          if (allowCancel) {
            html += `
              <button class="cancel-button" onclick="cancelBooking(${lesson.id})">
                  Cancel booking
              </button>
            `
          }

          html += "</div>"

          return html;
        }

        document.getElementById("tutor-select").addEventListener("change", updateBookingSection);
        document.getElementById("instrument-select").addEventListener("change", updateBookingSection);

        async function updateBookingSection() {
          const instrumentSelect = document.getElementById("instrument-select");
          const tutorSelect = document.getElementById("tutor-select");

          const selectedTutor = tutorSelect.value;

          tutorSelect.innerHTML = '<option value="">Select a tutor</option>';

          for (const tutor of window.tutors) {
            if (instrumentSelect.value !== "" && !(await canTutorTeachPupilInstrument(instrumentSelect.value, tutor, window.instruments))) {
              continue;
            }

            const option = document.createElement("option");

            option.value = tutor.id;
            option.textContent = tutor.firstName + " " + tutor.lastName;

            tutorSelect.appendChild(option);
          }

          tutorSelect.value = selectedTutor;

          if (tutorSelect.selectedIndex === -1) {
              tutorSelect.value = "";
          }
        }

        document.getElementById("show-timetable-button").addEventListener("click", () => {
          showTutorTimetable();
        });

        async function showTutorTimetable() {
          const tutorTimetable = document.getElementById("tutor-timetable");

          tutorTimetable.innerHTML = "";

          const weekDays = getWeekDays();
          for (let i = 0; i < weekDays.length; i++) {
            tutorTimetable.innerHTML += await getDayTimetableHTML(weekDays[i]);
          }
        }

        async function getDayTimetableHTML(weekDay) {
          timeslots = "";
          for (let i = 0; i < 22; i++) {
            timeslots += `
            <div class="timeslot">
            </div>
            `
          }

          return `
            <h3 class="top-margin">${weekDay}</h3>
            <div class="timeslot-container">
              ${timeslots}
            </div>
          `;
        }
    </script>
</html>

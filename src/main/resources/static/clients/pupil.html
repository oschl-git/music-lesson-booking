<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Music Lesson Booking Service | Pupil / Parent</title>
        <link rel="stylesheet" href="../style.css" />
    </head>
    <body>
        <div id="login">
            <h1 class="align-center top-margin">Pupil Login</h1>
            <p class="align-center large-top-margin bottom-margin">
                To access, enter your full name and matriculation number.
            </p>

            <form id="login-form" class="align-center">
                <div>
                    <label for="name">Full name:</label>
                    <input type="text" id="name" name="name" required />
                </div>

                <div>
                    <label for="matric">Matriculation number:</label>
                    <input type="number" id="matric" name="matric" required />
                </div>

                <button class="top-margin" type="submit" id="log-in-button">Log in</button>

                <div class="large-top-margin">
                    <a href="/"><< Back to role selection</a>
                </div>
            </form>
        </div>
        <div id="dashboard" hidden>
            <h1 class="align-center top-margin">Pupil Dashboard</h1>

            <p id="logged-in-details" class="align-center italic"></p>
            <p class="align-center top-margin bottom-margin bold">
                On this page, you can view and cancel your booked lessons, and book lessons for next week.
            </p>

            <h2>Booked lessons</h2>

            <h3>This week:</h3>
            <div id="this-week-section" class="booked-lesson-container"></div>

            <h3 class="top-margin">Next week:</h3>
            <div id="next-week-section" class="booked-lesson-container""></div>

            <h2>Book lessons for next week</h2>

            <div>
                <select id="instrument-select">
                    <option value="">Select an instrument</option>
                </select>

                <select id="tutor-select">
                    <option value="">Select a tutor</option>
                </select>
                <button id="show-timetable-button">Show available times</button>
            </div>
            <div id="tutor-timetable"></div>
            <div class="large-top-margin large-bottom-margin align-center">
                <a href="/"><< Log out</a>
            </div>
        </div>
    </body>

    <script src="../js/common.js"></script>
    <script>
    document
        .getElementById("login-form")
        .addEventListener("submit", async (event) => {
            event.preventDefault();

            const logInButton = document.getElementById("log-in-button");
            logInButton.disabled = true;

            const name = document.getElementById("name").value.trim();
            const matric = Number(document.getElementById("matric").value);

            let result;

            try {
                result = await makePostRequest("/pupils/verify", {
                    name: name,
                    matric: matric,
                });
            } catch (error) {
                alert("Verification failed.");
                return;
            }

            if (result.valid) {
                window.pupilName = result.name;
                window.matric = result.matric;
                window.age = result.age;
                window.instruments = result.instruments;

                window.tutors = await makeGetRequest(`/tutors/eligible?pupilMatric=${result.matric}`);

                document.getElementById("login").hidden = true;
                document.getElementById("dashboard").hidden = false;

                const loggedInDetailsElement = document.getElementById("logged-in-details");

                loggedInDetailsElement.innerHTML = `Logged in pupil: ${window.pupilName} (matriculation number: ${window.matric}, age: ${window.age})`

                await renderDashboard();
                await updateBookingSection();
            } else {
                alert(
                    "Incorrect login details. Check your name and matriculation number.",
                );

                logInButton.disabled = false;

                return;
            }
        });

    async function renderDashboard() {
        const thisWeekSection = document.getElementById("this-week-section");
        const nextWeekSection = document.getElementById("next-week-section");
        const instrumentSelect = document.getElementById("instrument-select");

        thisWeekSection.innerHTML = "";
        nextWeekSection.innerHTML = "";

        const lessonsThisWeek = await makeGetRequest(`/bookings/this-week/pupil?matric=${window.matric}`)
        const lessonsNextWeek = await makeGetRequest(`/bookings/next-week/pupil?matric=${window.matric}`)

        window.lessonsNextWeek = lessonsNextWeek;

        for (const lesson of lessonsThisWeek) {
            thisWeekSection.innerHTML += bookedLessonHTML(lesson);
        }

        if (thisWeekSection.innerHTML === "") {
            thisWeekSection.innerHTML = "You have no lessons booked this week."
        }

        for (const lesson of lessonsNextWeek) {
            nextWeekSection.innerHTML += bookedLessonHTML(lesson, true);
        }

        if (nextWeekSection.innerHTML === "") {
            nextWeekSection.innerHTML = "You have no lessons booked next week."
        }

        for (const instrument of Object.keys(window.instruments)) {
            const option = document.createElement("option");

            option.value = instrument;
            option.textContent = instrument;

            instrumentSelect.appendChild(option);
        }
    }

    async function cancelBooking(bookingId) {
        if (!confirm("Are you sure you want to cancel this booking?")) {
            return;
        }

        try {
            await makeDeleteRequest(`/bookings/${bookingId}`);
        } catch (error) {
            alert("Failed cancelling booking.");
        }

        await renderDashboard();
        await updateBookingSection();
    }

    function bookedLessonHTML(lesson, allowCancel = false) {
        const startDate = new Date(lesson.startDateTime);
        const endDate = new Date(startDate);

        endDate.setMinutes(endDate.getMinutes() + 30);

        const date = startDate.toLocaleDateString("en-GB", {
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric"
        });

        const start = startDate.toLocaleTimeString("en-GB", {
            hour: "2-digit",
            minute: "2-digit"
        });

        const end = endDate.toLocaleTimeString("en-GB", {
            hour: "2-digit",
            minute: "2-digit"
        });

        let html = `
        <div class="booked-lesson">
          <h4 class="capitalize">${lesson.instrument}</h4>
          <ul>
            <li>${date}</li>
            <li>${start} - ${end}</li>
            <li>tutor: ${lesson.tutor.firstName} ${lesson.tutor.lastName}</li>
          </ul>
      `

        if (allowCancel) {
            html += `
          <button class="cancel-button bottom-margin" onclick="cancelBooking(${lesson.id})">
              Cancel booking
          </button>
        `
        }

        html += "</div>"

        return html;
    }

    document.getElementById("tutor-select").addEventListener("change", updateBookingSection);
    document.getElementById("instrument-select").addEventListener("change", updateBookingSection);

    async function updateBookingSection() {
        const instrumentSelect = document.getElementById("instrument-select");
        const tutorSelect = document.getElementById("tutor-select");

        const selectedTutor = tutorSelect.value;

        tutorSelect.innerHTML = '<option value="">Select a tutor</option>';

        for (const tutor of window.tutors) {
            if (instrumentSelect.value !== "" && !(await canTutorTeachPupilInstrument(instrumentSelect.value, tutor, window.instruments))) {
                continue;
            }

            const option = document.createElement("option");

            option.value = tutor.id;
            option.textContent = tutor.firstName + " " + tutor.lastName;

            tutorSelect.appendChild(option);
        }

        tutorSelect.value = selectedTutor;

        if (tutorSelect.selectedIndex === -1) {
            tutorSelect.value = "";
        }

        if (window.timetableInstrument && window.timetableTutor) {
            showTutorTimetable();
        }
    }

    document.getElementById("show-timetable-button").addEventListener("click", () => {
        const instrumentSelect = document.getElementById("instrument-select");
        const tutorSelect = document.getElementById("tutor-select");

        if (instrumentSelect.value === "" || tutorSelect.value === "") {
            alert("Instrument and tutor must be selected to show the booking timetable.")
            return;
        }

        window.timetableInstrument = instrumentSelect.value;
        window.timetableTutor = tutorSelect.value;

        showTutorTimetable();
    });

    async function showTutorTimetable() {
        const tutorTimetable = document.getElementById("tutor-timetable");

        tutorTimetable.innerHTML = "";

        const tutorUnavailabilities = await makeGetRequest(`/tutors/unavailabilities/upcoming?tutorId=${window.timetableTutor}`);
        const tutorBookings = await makeGetRequest(`/bookings/next-week/tutor?tutorId=${window.timetableTutor}`);

        for (let i = 0; i < 7; i++) {
            tutorTimetable.innerHTML += await getDayTimetableHTML(i, tutorUnavailabilities, tutorBookings);
        }
    }

    async function getDayTimetableHTML(dayIndex, tutorUnavailabilities, tutorBookings) {
        const time = getNextMonday();
        time.setDate(time.getDate() + dayIndex)
        time.setHours(9, 0, 0, 0);

        const formattedDay = time.toLocaleDateString("en-GB", {
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric"
        });

        timeslots = "";
        for (let i = 0; i < 22; i++) {
            const formattedTime = time.toLocaleTimeString("en-GB", {
                hour: "2-digit",
                minute: "2-digit"
            });

            let isValidSlot = true;

            if (time.getDay() === 0) {
                isValidSlot = false;
            } else if (time.getDay() !== 6 && (time.getHours() < 16 || time.getHours() > 20)) {
                isValidSlot = false;
            } else if (window.age < 16 && time.getHours() >= 18) {
                isValidSlot = false;
            }

            if (isValidSlot) {
                for (lesson of window.lessonsNextWeek) {
                    if ((new Date(lesson.startDateTime)).toDateString() === time.toDateString()) {
                        isValidSlot = false;
                    }
                }
            }

            if (isValidSlot) {
                for (const unavailability of tutorUnavailabilities) {
                    const start = new Date(unavailability.startTime);
                    const end = new Date(unavailability.endTime);

                    const slotEnd = new Date(time);
                    slotEnd.setMinutes(slotEnd.getMinutes() + 30);

                    if (time < end && slotEnd > start) {
                        isValidSlot = false;
                        break;
                    }
                }
            }

            if (isValidSlot) {
                for (const booking of tutorBookings) {
                    const start = new Date(booking.startDateTime);

                    if (time.getTime() === start.getTime()) {
                        isValidSlot = false;
                        break;
                    }
                }
            }

            if (isValidSlot) {
                const backendTimeString = time.toLocaleString("sv-SE").replace(" ", "T");
                timeslots += `
              <div class="timeslot" onclick="bookLesson('${backendTimeString}')" style='cursor: pointer;'">
                  ${formattedTime}<br>
                  FREE
              </div>
          `;
            } else {
                timeslots += `
              <div class="invalid-timeslot"">
                  ${formattedTime}<br>
                  UNAVAIL
              </div>
          `;
            }


            time.setMinutes(time.getMinutes() + 30);
        }

        return `
        <h3 class="top-margin">${formattedDay}</h3>
        <div class="timeslot-container">
          ${timeslots}
        </div>
      `;
    }

    async function bookLesson(timeString) {
        const date = new Date(timeString);

        const formattedTime = date.toLocaleString("en-GB", {
            weekday: "long",
            day: "numeric",
            month: "long",
            hour: "2-digit",
            minute: "2-digit"
        });

        if (!confirm(`Are you sure you want to book ${window.timetableInstrument} at ${formattedTime}?`)) {
            return;
        }

        try {
            await makePostRequest("/bookings", {
                tutorId: Number(window.timetableTutor),
                pupilMatric: window.matric,
                pupilName: window.pupilName,
                instrument: window.timetableInstrument,
                startDateTime: timeString,
            });
        } catch (error) {
            alert("Failed booking lesson.");
            return;
        }

        await renderDashboard();
        await updateBookingSection();
    }
    </script>
</html>
